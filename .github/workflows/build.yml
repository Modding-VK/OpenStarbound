  build-mac-intel:
    name: Build OpenStarbound macOS x86_64
    runs-on: macos-15-intel
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macOS == true }}
    #if: ${{ (github.event_name == 'workflow_dispatch') && (inputs.macOS == true) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: |
          brew install autoconf automake libtool tarlz

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest resolved 2026-10-25
        with:
          cmakeVersion: 3.29.0

      - name: sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-Intel-${{ runner.os }}
          max-size: 250M

      - name: vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@4f07be616a4604dd29f3c6885975cf2c04abee71 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CMake
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'macos-release'
          buildPreset: 'macos-release'
          testPreset: 'macos-release'

      - name: Copy Libraries
        working-directory: ${{ github.workspace }}
        run: |
          cp \
            lib/osx/x64/*.dylib \
            lib/osx/libsteam_api.dylib \
            dist/

      - name: Prepare Artifacts
        working-directory: ${{ github.workspace }}
        run: |
          tarlz -c9vf dist.tar.lz dist
          mv -v dist.tar.lz OpenStarbound-macOS-Intel.tar.lz

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-macOS-Intel
          path: OpenStarbound-macOS-Intel.tar.lz
          archive: false

      - name: Assemble Files
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/macos/assemble.sh
          mv -v client.tar.lz OpenStarbound-macOS-Intel-Client.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-macOS-Intel-Client
          path: OpenStarbound-macOS-Intel-Client.tar.lz
          archive: false

