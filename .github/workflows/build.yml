name: Build
permissions:
  actions: read
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  
on:
  workflow_dispatch:
    inputs:
      linux:
        type: boolean
        description: Linux (GCC)
        default: false
      linux_clang:
        type: boolean
        description: Linux (Clang)
        default: false
      windows:
        type: boolean
        description: Windows
        default: true
      macOS:
        type: boolean
        description: macOS
        default: false
      publish_windows_release:
        type: boolean
        description: Publicar o instalador do Windows como ativo de uma Release
        default: false

  push:
    paths:
      - '.github/workflows/build.yml'
      - 'assets/**'
      - 'scripts/ci/**'
      - 'scripts/inno/**'
      - 'source/**'
      - 'toolchains/**'
      - 'triplets/**'
    branches:
      - '**'

  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'assets/**'
      - 'scripts/ci/**'
      - 'scripts/inno/**'
      - 'source/**'
      - 'toolchains/**'
      - 'triplets/**'
    branches:
      - '**'

jobs:
  build_windows:
    name: Build OpenStarbound Windows x64
    runs-on: windows-latest
    if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.windows == true)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'recursive'

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest resolved 2026-10-25
        with:
          cmakeVersion: 3.29.2

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0
        with:
          llvm-version: 22

      - name: sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 2000M

      - name: vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      #- name: Restore vcpkg cache
      #  id: vcpkg-cache
      #  uses: TAServers/vcpkg-cache@4f07be616a4604dd29f3c6885975cf2c04abee71 # v3
      #  with:
      #    token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CMake
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        env:
          LLVMInstallDir: ${{ env.LLVM_PATH }}
          llvmX64: ${{ env.LLVM_PATH }}
        #  VCPKG_FEATURE_FLAGS: "binarycaching"
        #  VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'windows-release-ci'
          buildPreset: 'windows-release-ci'
          testPreset: 'windows-release-ci'

      - name: Run Post-Build Task
        working-directory: ${{ github.workspace }}
        run: scripts\ci\windows\post_build.bat

      - name: Assemble Files
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/windows/assemble.bat --skip-archives

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Windows-All-DevOnly
          path: dist/
          compression-level: 1
          if-no-files-found: error

      - name: Upload Client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Windows-Client
          path: client_distribution/
          compression-level: 1
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Windows-Server
          path: server_distribution/
          compression-level: 1
          if-no-files-found: error
          
      - name: Install Inno Setup
        run: |
          echo "Checking pre-installation..."
          
          set "ISCC_PATH=%programfiles%\Inno Setup 7\ISCC.exe"
          
          if exist "%ISCC_PATH%" (
            echo ::warning::Inno Setup is already installed
            exit /b 0
          )
          
          echo "Downloading Inno Setup..."
  
          set "_url_=https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          set "_file_=innosetup.exe"
  
          curl --fail --show-error --location --proto "=https" --proto-redir "=https" --output "%tmp%\%_file_%" "%_url_%"
          if errorlevel 1 exit /b 1

          certutil -hashfile "%tmp%\%_file_%" SHA256 | findstr /i /c:"5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1" > nul
          if errorlevel 1 (
            echo ::error::Inno Setup SHA-256 does not match the official release digest
            exit /b 1
          )
          
          echo "Installing Inno Setup..."
          "%tmp%\%_file_%" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          
          if not exist "%ISCC_PATH%" (
            echo "::error::Inno Setup installation failed"
            exit 1
          )
          
          echo ::warning::Inno Setup installed successfully!
        shell: cmd

      - name: Create Installer
        working-directory: ${{ github.workspace }}
        run: |
          & "C:\Program Files\Inno Setup 7\iscc.exe" /Oinstaller scripts\inno\setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Windows-Installer
          path: installer/OpenStarbound-Windows-Installer.exe
          archive: true
          compression-level: 0
          if-no-files-found: error

  publish_windows_release:
    name: Publish Windows Installer Release
    needs: build_windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_windows_release == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download installer from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name OpenStarbound-Windows-Installer --dir installer

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "windows-build-${{ github.run_number }}"
          installer/OpenStarbound-Windows-Installer.exe
          --title "OpenStarbound Windows build ${{ github.run_number }}"
          --prerelease
          --target "$GITHUB_SHA"

  build_linux:
    name: Build OpenStarbound Linux x86_64
    runs-on: ubuntu-22.04
    #if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.linux == true)) }}
    if: ${{ (github.event_name == 'workflow_dispatch') && (inputs.linux == true) }}
    steps:
      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkgconf libxmu-dev libgl-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          autoconf autoconf-archive automake libtool patchelf tarlz

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest resolved 2026-10-25
        with:
          cmakeVersion: 3.29.2

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'recursive'

      - name: sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 250M

      - name: vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@4f07be616a4604dd29f3c6885975cf2c04abee71 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CMake
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'linux-release'
          buildPreset: 'linux-release'

      - name: Prepare Artifacts
        working-directory: ${{ github.workspace }}
        run: tarlz -c9vf OpenStarbound-Linux-GCC.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Linux-GCC
          path: OpenStarbound-Linux-GCC.tar.lz
          archive: false

      - name: Run Tests
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          testPreset: 'linux-release'

      - name: Assemble Files
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/linux/assemble.sh
          mv -v client.tar.lz OpenStarbound-Linux-GCC-Client.tar.lz
          mv -v server.tar.lz OpenStarbound-Linux-GCC-Server.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Linux-GCC-Client
          path: OpenStarbound-Linux-GCC-Client.tar.lz
          archive: false

      - name: Upload Server Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Linux-GCC-Server
          path: OpenStarbound-Linux-GCC-Server.tar.lz
          archive: false

