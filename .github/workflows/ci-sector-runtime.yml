name: CI Sector Runtime
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-sector-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sector-runtime axis: Windows x64 H4 GL-compute probe build (+ optional RTX smoke).
# Keeps ci-integration.yml as the lean Linux CPU gate and does not touch build.yml
# (no Inno installer, no Linux ARM packaging).
#
# Smoke RTX (Desktop-Vinicius): no GitHub Actions self-hosted runner labels are
# registered/documented yet for that host. Leave run_rtx_smoke=false (default) so
# cloud gates never queue on a missing runner. When a GHA runner exists, dispatch
# with run_rtx_smoke=true and set rtx_runs_on to its label JSON array.
# Manual fallback: doc/sector-runtime-h4-gpu-probe-windows-rtx-checklist-2026-11-27.md
# + scripts/windows/run-h4-gl-compute-probe.ps1
on:
  push:
    branches:
      - cursor/integration-sector-runtime-7342
  pull_request:
    branches:
      - cursor/integration-sector-runtime-7342
  workflow_dispatch:
    inputs:
      windows_runs_on:
        type: string
        description: >-
          JSON array for the Windows GL probe job runs-on (x64 only).
          Default hosted windows-latest. Override only if a self-hosted Windows
          x64 runner is registered (e.g. ["self-hosted","Windows","X64"]).
        default: '["windows-latest"]'
      run_rtx_smoke:
        type: boolean
        description: >-
          Optional H4 probe smoke on a self-hosted RTX runner (Desktop-Vinicius).
          Default false — cloud/push/PR gates never wait for that machine.
        default: false
      rtx_runs_on:
        type: string
        description: >-
          JSON array of labels for the optional RTX smoke job. Placeholder until a
          GHA runner is registered on Desktop-Vinicius
          (e.g. ["self-hosted","Windows","X64","Desktop-Vinicius"]).
        default: '["self-hosted","Windows","X64","Desktop-Vinicius"]'

jobs:
  windows_gl_probe:
    name: Windows x64 GL-compute probe build
    runs-on: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.windows_runs_on || '["windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'recursive'

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest resolved 2026-10-25
        with:
          cmakeVersion: 3.29.2

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0
        with:
          llvm-version: 22

      - name: sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}-sector-runtime-gl
          max-size: 2000M

      - name: vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      # Safe binary cache for this workflow only (build.yml Windows cache stays commented).
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@4f07be616a4604dd29f3c6885975cf2c04abee71 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # H4 diagnostic: GL compute opt-in + GUI (SDL3/OpenGL). Not a release claim;
      # does not produce the Inno installer from build.yml.
      - name: Configure, Build, Test (windows-release-ci + GL compute)
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        env:
          LLVMInstallDir: ${{ env.LLVM_PATH }}
          llvmX64: ${{ env.LLVM_PATH }}
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'windows-release-ci'
          configurePresetAdditionalArgs: >-
            ['-DSTAR_ENABLE_WORLDGEN_GL_COMPUTE=ON','-DSTAR_BUILD_GUI=ON','-DSTAR_ENABLE_TRACY=OFF']
          buildPreset: 'windows-release-ci'
          testPreset: 'windows-release-ci'

      - name: Run Post-Build Task
        working-directory: ${{ github.workspace }}
        run: scripts\ci\windows\post_build.bat

      - name: Verify GL probe binary
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'dist\world_generation_gl_compute_probe.exe'
          if (!(Test-Path $probe)) {
            throw "Expected H4 probe at $probe after STAR_ENABLE_WORLDGEN_GL_COMPUTE=ON build"
          }
          Write-Host "Found probe: $probe"
          Get-Item $probe | Format-List Name, Length, LastWriteTime

      - name: Upload GL-compute probe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Windows-GLCompute-Probe
          path: |
            dist/world_generation_gl_compute_probe.exe
            dist/*.dll
          compression-level: 1
          if-no-files-found: error

  # Optional only: skipped unless workflow_dispatch + run_rtx_smoke.
  # Never part of the required cloud gate when left at default false.
  smoke_rtx:
    name: Smoke RTX (optional self-hosted)
    needs: windows_gl_probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rtx_smoke == true }}
    runs-on: ${{ fromJson(inputs.rtx_runs_on) }}
    steps:
      - name: Checkout (scripts + checklist)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Download GL-compute probe artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: OpenStarbound-Windows-GLCompute-Probe
          path: dist

      - name: Run H4 GL compute probe on RTX
        shell: pwsh
        run: |
          $probe = Join-Path $PWD 'dist\world_generation_gl_compute_probe.exe'
          if (!(Test-Path $probe)) {
            throw "Probe binary missing after artifact download: $probe"
          }
          Write-Host "Running $probe (self-hosted RTX smoke)"
          & $probe
          if ($LASTEXITCODE -ne 0) {
            throw "world_generation_gl_compute_probe exited $LASTEXITCODE"
          }
