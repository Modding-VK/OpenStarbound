name: CI Sector Runtime
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-sector-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sector-runtime axis: Windows x64 H4 GL-compute probe build (+ optional RTX smoke).
# Keeps ci-integration.yml as the lean Linux CPU gate and does not touch build.yml
# (no Inno installer, no Linux ARM packaging).
#
# --- Desktop-Vinicius / RTX smoke (as of 2026-11-27) ---
# Desktop-Vinicius is a Cursor private agent worker (Windows RTX,
# checkout m:\StarboundTeste\OpenStarbound). It is NOT a registered GitHub
# Actions self-hosted runner. Repo/org GHA runner APIs are not usable here to
# discover labels, and no GHA runner labels for that host are documented.
#
# Therefore rtx_runs_on defaults below are PLACEHOLDERS only. Leave
# run_rtx_smoke=false (default) so push/PR cloud gates never queue on a
# missing runner. When a real GHA runner is installed on Desktop-Vinicius,
# dispatch with run_rtx_smoke=true and set rtx_runs_on to that runner's
# actual label JSON (replace the placeholders).
#
# Manual GPU smoke (current path):
#   doc/sector-runtime-h4-gpu-probe-windows-rtx-checklist-2026-11-27.md
#   scripts/windows/run-h4-gl-compute-probe.ps1
#
# Skip docs-only tips (doc/, *.md, progress/flow). Material paths only;
# Build remains manual material-only. workflow_dispatch always runs.
on:
  push:
    branches:
      - cursor/integration-sector-runtime-7342
    paths:
      - 'source/**'
      - 'assets/**'
      - 'cmake/**'
      - 'toolchains/**'
      - 'triplets/**'
      - 'scripts/**'
      - '.github/workflows/ci-sector-runtime.yml'
  pull_request:
    branches:
      - cursor/integration-sector-runtime-7342
    paths:
      - 'source/**'
      - 'assets/**'
      - 'cmake/**'
      - 'toolchains/**'
      - 'triplets/**'
      - 'scripts/**'
      - '.github/workflows/ci-sector-runtime.yml'
  workflow_dispatch:
    inputs:
      windows_runs_on:
        type: string
        description: >-
          JSON array for the Windows GL probe job runs-on (x64 only).
          Default hosted ["windows-latest"]. Override only if a self-hosted
          Windows x64 GHA runner is registered (not the Cursor worker).
        default: '["windows-latest"]'
      run_rtx_smoke:
        type: boolean
        description: >-
          Opt-in H4 probe smoke on a GHA self-hosted RTX runner. Default false.
          Desktop-Vinicius has no documented GHA labels yet — do not enable
          until a runner is registered, or the job will queue forever.
          Cloud push/PR gates skip this job when false.
        default: false
      rtx_runs_on:
        type: string
        description: >-
          PLACEHOLDER labels for smoke_rtx until a GHA runner exists on
          Desktop-Vinicius. Suggested convention once registered:
          ["self-hosted","Windows","X64","Desktop-Vinicius","RTX"].
          Replace with the runner's real labels before enabling run_rtx_smoke.
        default: '["self-hosted","Windows","X64","Desktop-Vinicius","RTX"]'

jobs:
  windows_gl_probe:
    name: Windows x64 GL-compute probe build
    runs-on: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.windows_runs_on || '["windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'recursive'

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest resolved 2026-10-25
        with:
          cmakeVersion: 3.29.2

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0
        with:
          llvm-version: 22

      - name: sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}-sector-runtime-gl
          max-size: 2000M

      - name: vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      # Safe binary cache for this workflow only (build.yml Windows cache stays commented).
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@4f07be616a4604dd29f3c6885975cf2c04abee71 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # H4 diagnostic: GL compute opt-in + GUI (SDL3/OpenGL). Not a release claim;
      # does not produce the Inno installer from build.yml.
      - name: Configure, Build, Test (windows-release-ci + GL compute)
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        env:
          LLVMInstallDir: ${{ env.LLVM_PATH }}
          llvmX64: ${{ env.LLVM_PATH }}
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'windows-release-ci'
          configurePresetAdditionalArgs: >-
            ['-DSTAR_ENABLE_WORLDGEN_GL_COMPUTE=ON','-DSTAR_BUILD_GUI=ON','-DSTAR_ENABLE_TRACY=OFF']
          buildPreset: 'windows-release-ci'
          testPreset: 'windows-release-ci'

      - name: Run Post-Build Task
        working-directory: ${{ github.workspace }}
        run: scripts\ci\windows\post_build.bat

      - name: Verify GL probe binary
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'dist\world_generation_gl_compute_probe.exe'
          if (!(Test-Path $probe)) {
            throw "Expected H4 probe at $probe after STAR_ENABLE_WORLDGEN_GL_COMPUTE=ON build"
          }
          Write-Host "Found probe: $probe"
          Get-Item $probe | Format-List Name, Length, LastWriteTime

      - name: Upload GL-compute probe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenStarbound-Windows-GLCompute-Probe
          path: |
            dist/world_generation_gl_compute_probe.exe
            dist/*.dll
          compression-level: 1
          if-no-files-found: error

  # Always-green cloud note: makes the opt-in/manual policy visible in Actions UI.
  # Does not build, does not require GPU, does not block on Desktop-Vinicius.
  rtx_smoke_policy:
    name: RTX smoke policy (informational)
    runs-on: ubuntu-22.04
    steps:
      - name: Document opt-in RTX smoke + placeholders
        run: |
          cat <<'EOF'
          CI Sector Runtime — RTX smoke policy
          ------------------------------------
          Cloud gate = windows_gl_probe only (hosted windows-latest by default).

          Desktop-Vinicius is a Cursor agent worker (Windows RTX), NOT a GitHub
          Actions self-hosted runner. No real GHA runner labels are known for it.

          Inputs (workflow_dispatch):
            run_rtx_smoke  — default false; keep false for push/PR cloud gates
            rtx_runs_on    — PLACEHOLDER JSON labels, default:
                             ["self-hosted","Windows","X64","Desktop-Vinicius","RTX"]
                             Replace with real GHA runner labels before enabling smoke.
            windows_runs_on — default ["windows-latest"] (x64 hosted)

          Manual GPU path until a GHA runner exists:
            doc/sector-runtime-h4-gpu-probe-windows-rtx-checklist-2026-11-27.md
            scripts/windows/run-h4-gl-compute-probe.ps1
          EOF

  # Optional only: skipped unless workflow_dispatch + run_rtx_smoke.
  # Never part of the required cloud gate when left at default false.
  smoke_rtx:
    name: Smoke RTX (optional self-hosted)
    needs: windows_gl_probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rtx_smoke == true }}
    runs-on: ${{ fromJson(inputs.rtx_runs_on) }}
    # Caps runtime once a runner picks up the job; does not cancel indefinite
    # queue wait if labels match no registered runner — keep run_rtx_smoke=false.
    timeout-minutes: 30
    steps:
      - name: Checkout (scripts + checklist)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Download GL-compute probe artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: OpenStarbound-Windows-GLCompute-Probe
          path: dist

      - name: Run H4 GL compute probe on RTX
        shell: pwsh
        run: |
          $probe = Join-Path $PWD 'dist\world_generation_gl_compute_probe.exe'
          if (!(Test-Path $probe)) {
            throw "Probe binary missing after artifact download: $probe"
          }
          Write-Host "Running $probe (self-hosted RTX smoke)"
          Write-Host "runs-on labels came from workflow_dispatch input rtx_runs_on (placeholders until a real GHA runner exists)."
          & $probe
          if ($LASTEXITCODE -ne 0) {
            throw "world_generation_gl_compute_probe exited $LASTEXITCODE"
          }
